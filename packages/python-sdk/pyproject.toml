[project]
name = "flowforge-sdk"
version = "0.1.0"
description = "Python SDK for the FlowForge distributed task platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge_sdk"]
