[project]
name = "flowforge-core"
version = "0.1.0"
description = "FlowForge core: configuration, persistence, broker, domain services shared by API, worker and scheduler"
requires-python = ">=3.12"
dependencies = [
    "flowforge-shared",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis[hiredis]>=6.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25.4",
    "orjson>=3.10",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "prometheus-client>=0.22",
    "jsonschema>=4.24",
    "email-validator>=2.2",
    "opentelemetry-api>=1.36",
    "opentelemetry-sdk>=1.36",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
    "opentelemetry-instrumentation-redis>=0.57b0",
]

[project.scripts]
flowforge-admin = "flowforge_core.cli:main"

[tool.uv.sources]
flowforge-shared = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge_core"]
