[project]
name = "flowforge-api"
version = "0.1.0"
description = "FlowForge API gateway (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "flowforge-core",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
]

[project.scripts]
flowforge-api = "flowforge_api.__main__:main"

[tool.uv.sources]
flowforge-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge_api"]
