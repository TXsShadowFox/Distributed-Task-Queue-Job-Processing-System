# Single entry point: the dashboard and the API on one origin (no CORS, SameSite cookies just work).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 2m;  # the API rejects bodies over 1 MiB itself; this is the outer bound

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"upstream":"$upstream_addr","request_id":"$request_id"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Writable paths for the unprivileged nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    upstream api {
        server api:8000;
        keepalive 32;
    }
    upstream web {
        server web:3000;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    server {
        listen 8080;

        # Security headers for every response. The CSP allows inline scripts because Next.js and the theme
        # bootstrap emit them; everything else is same-origin only (see docs/evaluation/security.md).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # Behind TLS termination, also send: Strict-Transport-Security "max-age=31536000; includeSubDomains".

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Server-Sent Events: stream immediately, never buffer, keep idle streams open (the API sends keepalives).
        location ~ ^/api/v1/(events/stream|tasks/[^/]+/logs/stream)$ {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering "no" always;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_read_timeout 60s;
        }

        location = /health/live { proxy_pass http://api; access_log off; }
        location = /health/ready { proxy_pass http://api; access_log off; }

        # Metrics are scraped on the internal network, never through the public entry point.
        location = /metrics { return 404; }

        location / {
            proxy_pass http://web;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
