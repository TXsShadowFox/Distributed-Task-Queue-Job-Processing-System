[project]
name = "flowforge-scheduler"
version = "0.1.0"
description = "FlowForge control plane: outbox relay, delayed/retry promotion, cron schedules, lease reaper, reconciler"
requires-python = ">=3.12"
dependencies = [
    "flowforge-core",
]

[project.scripts]
flowforge-scheduler = "flowforge_scheduler.__main__:main"

[tool.uv.sources]
flowforge-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge_scheduler"]
